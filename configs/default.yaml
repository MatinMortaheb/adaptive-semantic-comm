# Default configuration. Paper values unless marked ASSUMPTION.
out_dir: outputs
device: cuda

data:
  root: /path/to/tiny-imagenet-200      # contains train/, val/ (val_annotations.txt), wnids.txt
  input_hw: [320, 480]                   # paper: all images resized to 320x480
  native_hw: [64, 64]                    # TinyImageNet native resolution (rates are reported per native pixel)
  num_classes: 200
  synthetic: false                       # smoke tests only
  num_train: null                        # null = full split
  num_test: null                         # TinyImageNet test labels are not public -> val split used as test
  interpolation: bicubic                 # ASSUMPTION: resize filter

vit:                                      # Methods: DINO ViT-S/8, D=384, K=12, H=6
  arch: vit_small
  patch: 8
  pretrained: true                        # DINO self-supervised init (dl.fbaipublicfiles.com)
  weights_url: https://dl.fbaipublicfiles.com/dino/dino_deitsmall8_pretrain/dino_deitsmall8_pretrain.pth
  ckpt: null                              # path to YOUR fine-tuned ViT (skips S0 if given)

classifier:                               # downstream classifier evaluated on reconstructions
  arch: hf_vit                            # the submitted paper's classifier (authors' classification.py):
  hf_model: tzhao3/vit-tiny-imagenet      #   Hugging Face ViT fine-tuned on TinyImageNet (hub id or local clone path)
                                          # 'resnet50' / 'resnet18' = the v1/v2 classifier trained by s0b
  ckpt: null                              # resnet only: path to a classifier checkpoint (skips S0b if given)
  imagenet_init: true

binary:                                   # Section "Transformer-aided semantic communication"
  decoder_mode: per_rate                  # 'per_rate' (one decoder per r, alpha sampled from alpha_sweep in training),
                                          # 'per_rate_alpha' (one per (r, alpha): closest to the paper, 24 decoders), 'shared'
  rates: [1.0, 0.75, 0.5, 0.25, 0.15, 0.1]  # 0.15 and 0.1 added (more aggressive compression)
  eval_blacken: true                      # which accuracy the figures use: true = untransmitted regions blackened
                                          # ('correct'), false = decoder output as is ('correct_raw'); both are saved
  alpha_main: 1.0
  alpha_sweep: [0.0, 0.25, 0.5, 0.7, 0.85, 1.0]   # ; 0 = purely random selection
  token_bits: 8                           # ASSUMPTION b_z: bits per element of a transmitted ViT token
  lr: 5.0e-4                              # paper
  batch_size: 32                          # paper

mr:                                       # Section "Multi-resolution transformer-aided semantic communication"
  levels_bytes: [0, 12, 24, 48, 192]      # paper
  latent_bits: 8                          # ASSUMPTION: 8-bit uniform quantization of encoder outputs
  latent_activation: sigmoid              # ASSUMPTION: bounds latents to [0,1] before quantization
  lr: 5.0e-4                              # (cosine decay). The paper's 2e-5 left the codecs under-trained
                                          # in our runs (48 B worse than 24 B); report the value used.
  batch_size: 32                          # paper (batches of images; patches are flattened)
  fixed_res_q: [0.25, 0.5, 0.75, 1.0]    # Fig. 6(b): fraction of patches selected, single resolution
  rate_fracs: [0.0625, 0.08, 0.1, 0.125, 0.15, 0.2, 0.25, 0.35, 0.5, 0.75, 1.0]  # budget / R_full
  header_bits: 16                         # mode + budget index
  patches_per_step: 8192                  # random patches per codec training step (from a batch of images)
  eval_rate_fracs_ablation: [0.08, 0.15, 0.3]   # rates (budget / R_full) reported in the level-set ablation table
  codec_domain: upsampled                 # 'upsampled' (paper) or 'native' (MR-native, see README)
  ablation_sizes: [8, 12, 24, 32, 48, 64, 96]   # codecs to train for the level-set ablation
  ablation_sets:
    - [0, 24, 192]
    - [0, 12, 48, 192]
    - [0, 12, 24, 48, 192]
    - [0, 12, 24, 48, 96, 192]
    - [0, 8, 32, 64, 192]

baselines:                                # jpeg_qualities: [1, 3, 5, 8, 10, 15, 20, 30, 40, 50, 60, 70, 80, 90, 95]
  jp2_rates: [400, 200, 100, 50, 30, 20, 12, 8, 5, 3, 2]   # Pillow JPEG2000 compression ratios
  webp_qualities: [1, 5, 10, 20, 30, 50, 70, 90]
  bpg_qps: [51, 46, 42, 38, 34, 30, 26, 22]                  # used only if `bpgenc` is on PATH
  iaq_max_bits: 8

witt:                                     # uses the authors' public code, cloned by scripts/s7_witt.py
  repo: https://github.com/KeYang8/WITT
  input: native                           # 'native' (64x64) or 'upsampled' (320x480)
  C_list: [2, 4, 6, 12, 24, 48, 96]       # bottleneck dims. native input: rho = C/96 (C=6 -> 1/16, C=24 -> 1/4, C=96 -> 1)
                                          # upsampled input: rho = C/40.96 (rho is per native sample)
  train_snrs: [1, 4, 7, 10, 13]           # paper default (random-SNR training with ModNet)
  lr: 1.0e-4

channel:                                  # eval_snrs_db: [0, 3, 6, 9, 12, 15, 18, 21]
  awgn_snr_db: 10                         # fixed SNR for the WITT bandwidth sweep
  mcs_margin_db: 1.0                      # SNR margin added to the 10%-BLER CQI thresholds (lower-BLER operation)
  outage_model: truncate                  # imperfect CSI: 'truncate' (in-order partial delivery) or 'drop_block'
  avg_snrs_db: [5, 10, 15, 20]            # Rayleigh block-fading average SNRs
  csi_sigma: [0.0, 0.1, 0.25, 0.5]        # relative SNR estimation error std
  erasure_probs: [0.0, 0.01, 0.02, 0.05, 0.1, 0.2]
  patches_per_packet: 16
  n_blocks: 2000                          # fading blocks per trace (one image per block)
  bandwidth_ratios: [0.25, 1.0]           # channel uses per native real sample (rho) for the fading/erasure experiments
                                          # (WITT is included where its rho matches: pass --witt_C 24 for 0.25 or 96 for 1.0)
  erasure_fill: zeros                     # 'zeros' or 'mean' (lost patches filled with the mean colour of received ones)

rate:
  entropy_coding: true                    # entropy-coded rates for the patch codecs (needs s2b_fit_entropy.py)

train:
  vit_epochs: 30                          # ASSUMPTION
  vit_lr: 1.0e-4                          # ASSUMPTION
  classifier_epochs: 30                   # ASSUMPTION
  classifier_lr: 1.0e-4                   # ASSUMPTION
  decoder_epochs: 30                      # paper text mentions 30 epochs in Fig. 5 discussion
  codec_epochs: 20                        # ASSUMPTION
  witt_epochs: 30                         # ASSUMPTION (100k images/epoch at 64x64)
  batch_size: 32
  num_workers: 8
  max_steps_per_epoch: null
  amp: true

eval:
  seeds: [0, 1, 2, 3, 4]                  # seeds for alpha sweep / CIs
  bootstrap: 10000                        # bootstrap resamples for 95% CIs
  batch_size: 32
